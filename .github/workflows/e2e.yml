name: Playwright E2E

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  playwright:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: toru
          POSTGRES_PASSWORD: password
          POSTGRES_DB: toru_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          
      mailpit:
        image: axllent/mailpit
        ports:
          - 1025:1025
          - 8025:8025

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 20
        
    - name: Install pnpm
      uses: pnpm/action-setup@v3
      with:
        version: 9

    - name: Get pnpm store directory
      shell: bash
      run: |
        echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

    - name: Setup pnpm cache
      uses: actions/cache@v4
      with:
        path: ${{ env.STORE_PATH }}
        key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-store-

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Install Playwright Browsers
      run: pnpm --dir apps/e2e exec playwright install --with-deps

    - name: Prisma Generate & Migrate
      run: |
        pnpm -F api exec prisma generate
        pnpm -F api exec prisma migrate deploy
      env:
        DATABASE_URL: postgresql://toru:password@localhost:5432/toru_test

    - name: Run Playwright tests
      run: pnpm -F e2e run test
      env:
        DATABASE_URL: postgresql://toru:password@localhost:5432/toru_test
        REDIS_URL: redis://localhost:6379
        JWT_SECRET: supersecretjwt
        ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef
        MAIL_HOST: localhost
        MAIL_PORT: 1025
        ALLOWED_ORIGINS: http://localhost:3000

    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: apps/e2e/playwright-report/
        retention-days: 30
